name: ci

on:
  push:
    # Tags reuse the checks on their branch commit.
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '10.0.401'
      - name: Test Release
        shell: pwsh
        run: |
          # Combined source boundary: build once, then reuse all profile binaries.
          try { dotnet build Lokad.Utf8Regex.slnx -c Release --tl:off --nologo -v minimal -p:GeneratePackageOnBuild=false 2>&1 | Tee-Object -FilePath build.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          try { dotnet test Lokad.Utf8Regex.slnx -c Release --no-build --no-restore --tl:off --nologo -v minimal -- RunConfiguration.TreatNoTestsAsError=true 2>&1 | Tee-Object -FilePath test.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test disabled dynamic code
        shell: pwsh
        run: |
          # Reuse the same binaries in a fresh host; restore its generated config.
          foreach ($framework in @('net10.0', 'net11.0')) {
            $config = Join-Path $PWD "tests/Lokad.Utf8Regex.Tests/bin/Release/$framework/Lokad.Utf8Regex.Tests.runtimeconfig.json"
            $original = [IO.File]::ReadAllBytes($config)
            try {
              $runtime = Get-Content -Raw -LiteralPath $config | ConvertFrom-Json -AsHashtable
              $runtime.runtimeOptions.configProperties['System.Runtime.CompilerServices.RuntimeFeature.IsDynamicCodeSupported'] = $false
              $runtime.runtimeOptions.configProperties['System.Runtime.CompilerServices.RuntimeFeature.IsDynamicCodeCompiled'] = $false
              $runtime | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $config
              dotnet test tests/Lokad.Utf8Regex.Tests/Lokad.Utf8Regex.Tests.csproj -c Release -f $framework --no-build --no-restore --tl:off --nologo -v minimal --filter 'FullyQualifiedName~Utf8DynamicCodeCapabilityTests' -- RunConfiguration.TreatNoTestsAsError=true 2>&1 | Tee-Object -FilePath "dynamic-code-$framework.log"
              if ($LASTEXITCODE -ne 0) { exit 1 }
            } finally { [IO.File]::WriteAllBytes($config, $original) }
          }
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: |
            build.log
            test.log
            dynamic-code-*.log
