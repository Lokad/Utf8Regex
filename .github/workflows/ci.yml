name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test Release
        shell: pwsh
        run: |
          # Complete the build before any inventory test inspects adapter DLLs.
          try { dotnet build Lokad.Utf8Regex.slnx -c Release --tl:off --nologo -v minimal -p:GeneratePackageOnBuild=false 2>&1 | Tee-Object -FilePath build.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          try { dotnet test Lokad.Utf8Regex.slnx -c Release --no-build --no-restore --tl:off --nologo -v minimal 2>&1 | Tee-Object -FilePath test.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: |
            build.log
            test.log
